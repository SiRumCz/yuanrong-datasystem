name: Agentic Engine
# Reusable, protocol-agnostic engine. A per-protocol trigger shim declares the
# real `on:` triggers and calls this workflow with the protocol.json path.
#
# run-name + concurrency are owned by the CALLER (the shim), not here: a
# workflow_call workflow cannot reliably reference `inputs` in workflow-level
# run-name/concurrency (it causes a startup_failure), and the run's identity +
# serialization are properly the triggering workflow's concern. The shim sets a
# concurrency group keyed by instance+branch so each fan-out branch's
# protocol-continue serializes independently.

on:
  workflow_call:
    inputs:
      protocol:
        description: "Path to the protocol.json (e.g. .github/agent-factory/protocols/code-review/protocol.json)"
        required: true
        type: string
      ref:
        description: "Ref-target only (workflow_dispatch): branch/ref to analyze. Blank for PR/comment/dispatch events."
        required: false
        type: string
        default: ""
      instance:
        description: "Ref-target only (workflow_dispatch): UI-supplied instance/correlation id. Blank → derived ref-<ref>."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ── Zone 1: engine-pre. Holds the state PAT; never runs agent code. ──
  plan:
    if: >
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    # Belt-and-braces bound: engine hooks/checks have their own
    # subprocess timeout (lib.hook_timeout_seconds), but a job-level
    # cap stops anything else from riding to GitHub's 6h ceiling.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    outputs:
      pr: ${{ steps.ctx.outputs.pr }}
      head_sha: ${{ steps.head.outputs.sha }}
      action: ${{ steps.plan.outputs.action }}
      iteration: ${{ steps.plan.outputs.iteration }}
      feedback: ${{ steps.plan.outputs.feedback }}
      sabotage: ${{ steps.sabotage.outputs.sabotage }}
      instance: ${{ steps.ctx.outputs.instance }}
      command: ${{ steps.ctx.outputs.command }}
      legs: ${{ steps.plan.outputs.legs }}
      inputs_json: ${{ steps.plan.outputs.inputs_json }}
      override_actor: ${{ steps.ctx.outputs.override_actor }}
      override_reason: ${{ steps.ctx.outputs.override_reason }}
      checkout_ref: ${{ steps.ctx.outputs.checkout_ref }}
      is_pr_run: ${{ steps.ctx.outputs.is_pr_run }}
    steps:
      - uses: actions/checkout@v5
      - id: ctx
        env:
          PROTO: ${{ inputs.protocol }}
          DISPATCH_INSTANCE: ${{ github.event.client_payload.instance }}
          DISPATCH_PATH: ${{ github.event.client_payload.path }}
          DISPATCH_TYPE: ${{ github.event.action }}
          PR_EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          WD_REF: ${{ inputs.ref }}
          WD_INSTANCE: ${{ inputs.instance }}
        run: |
          # Derive (instance, command, node_path). Agent-derived strings
          # (payload fields, comment body) are read via env, never interpolated.
          # Entry events (pull_request/issue_comment) map through the protocol's
          # `triggers` block; internal repository_dispatch types are generic.
          # CHECKOUT_REF is what the agents check out: PR head for PR-targeted runs,
          # the requested ref for ref-targeted (workflow_dispatch) runs.
          NODE_PATH=""
          CMD=""
          PR=""
          CHECKOUT_REF=""
          case "${{ github.event_name }}" in
            workflow_dispatch)
              # Ref-target entry (UI/API). No PR: instance is UI-supplied or derived
              # from the ref. The analyzed/checkout ref is the requested ref, or the
              # repo default branch when blank.
              TARGET_REF="$WD_REF"
              [ -n "$TARGET_REF" ] || TARGET_REF=$(gh api "repos/$REPO" --jq .default_branch)
              INSTANCE="$WD_INSTANCE"
              [ -n "$INSTANCE" ] || INSTANCE="ref-$(printf '%s' "$TARGET_REF" | tr '/' '-')"
              CMD="start"
              CHECKOUT_REF="$TARGET_REF" ;;
            repository_dispatch)
              INSTANCE="$DISPATCH_INSTANCE"
              [ -n "$INSTANCE" ] || { echo "[ctx] repository_dispatch with empty instance" >&2; exit 1; }
              # PR-keyed instances carry a pr; issue-keyed carry the issue number
              # (for commenting/labeling); ref-keyed ones (ref-*/ui-*) have neither.
              # Without the issue-* arm, an iterate/continue dispatch for an
              # issue-keyed run (e.g. impl-feature-auto) would set PR="" and the
              # agent's issue prefetch would fail ("invalid issue format").
              case "$INSTANCE" in
                pr-*)    PR="${INSTANCE#pr-}" ;;
                issue-*) PR="${INSTANCE#issue-}" ;;
                *)       PR="" ;;
              esac
              case "$DISPATCH_TYPE" in
                protocol-continue) CMD="continue"; NODE_PATH="$DISPATCH_PATH" ;;
                *) echo "[ctx] unknown repository_dispatch type: $DISPATCH_TYPE" >&2; exit 1 ;;
              esac ;;
            pull_request)
              PR="${{ github.event.pull_request.number }}"
              INSTANCE="pr-$PR"
              CMD=$(python3 .github/agent-factory/engine/driver.py derive-command "$PROTO" pull_request "$PR_EVENT_ACTION" "") ;;
            issue_comment)
              N="${{ github.event.issue.number }}"
              IS_PR="${{ github.event.issue.pull_request != null }}"
              if [ "$IS_PR" = "true" ]; then
                PR="$N"; INSTANCE="pr-$N"
              else
                # Plain-issue protocol (impl-feature-auto): key issue-<N>, comment on
                # issue #N (PR=$N is numeric), analyze the DEFAULT branch (no PR head;
                # the feature branch is created later by the implement agent).
                PR="$N"; INSTANCE="issue-$N"
                CHECKOUT_REF="${{ github.event.repository.default_branch }}"
              fi
              CMD=$(python3 .github/agent-factory/engine/driver.py derive-command "$PROTO" issue_comment "" "$COMMENT_BODY" "$IS_PR")
              if [ "$CMD" = "override" ]; then
                # Authorize from TRUSTED fields only (login from the event, repo
                # permission from the API) — never from the comment body. The body
                # is used only to match the prefix and carry an optional reason.
                PERM=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER_LOGIN/permission" \
                  --jq '.permission' 2>/dev/null || echo none)
                if [ "$PERM" = "write" ] || [ "$PERM" = "admin" ]; then
                  REASON="${COMMENT_BODY#/override}"   # strip the command prefix
                  REASON="${REASON# }"                 # strip one leading space
                  echo "override_actor=$COMMENTER_LOGIN" >> "$GITHUB_OUTPUT"
                  DELIM="ovr_$(openssl rand -hex 16)"
                  { echo "override_reason<<$DELIM"; printf '%s\n' "$REASON"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
                else
                  gh api "repos/${{ github.repository }}/issues/$PR/comments" \
                    -f "body=@$COMMENTER_LOGIN /override requires write access to this repository." >/dev/null 2>&1 || true
                  CMD=""   # not authorized → the engine no-ops (plan/dispatch skip on empty command)
                fi
              fi
              if [ "$CMD" = "resolve-human-task" ]; then
                # Decision derived from the matched prefix (mutually exclusive; no
                # prefix is a prefix of another). Identity from TRUSTED event fields.
                case "$COMMENT_BODY" in
                  /approve*)         HUMAN_TASK_DECISION=approve;         PREFIX=/approve ;;
                  /request-changes*) HUMAN_TASK_DECISION=request-changes; PREFIX=/request-changes ;;
                  /reject*)          HUMAN_TASK_DECISION=reject;          PREFIX=/reject ;;
                  *)                 HUMAN_TASK_DECISION="";              PREFIX="" ;;
                esac
                PERM=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER_LOGIN/permission" \
                  --jq '.permission' 2>/dev/null || echo none)
                if [ "$PERM" = "write" ] || [ "$PERM" = "admin" ]; then
                  REASON="${COMMENT_BODY#$PREFIX}"   # strip the matched prefix
                  REASON="${REASON# }"               # strip one leading space
                  echo "human_task_decision=$HUMAN_TASK_DECISION" >> "$GITHUB_OUTPUT"
                  echo "human_task_actor=$COMMENTER_LOGIN" >> "$GITHUB_OUTPUT"
                  echo "human_task_pr_author=${{ github.event.issue.user.login }}" >> "$GITHUB_OUTPUT"
                  DELIM="gate_$(openssl rand -hex 16)"
                  { echo "human_task_reason<<$DELIM"; printf '%s\n' "$REASON"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
                else
                  gh api "repos/${{ github.repository }}/issues/$PR/comments" \
                    -f "body=@$COMMENTER_LOGIN resolving this gate requires write access to this repository." >/dev/null 2>&1 || true
                  CMD=""   # not authorized → engine no-ops
                fi
              fi
              if [ "$CMD" = "answer" ]; then
                # /answer drives the pipeline forward (gate → next sub-state), so
                # require write access (same posture as resolve-human-task). Body is
                # untrusted and passed to next.py via env, never interpolated.
                PERM=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENTER_LOGIN/permission" \
                  --jq '.permission' 2>/dev/null || echo none)
                if [ "$PERM" = "write" ] || [ "$PERM" = "admin" ]; then
                  echo "answer_actor=$COMMENTER_LOGIN" >> "$GITHUB_OUTPUT"
                  DELIM="ans_$(openssl rand -hex 16)"
                  { echo "answer_body<<$DELIM"; printf '%s\n' "$COMMENT_BODY"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
                else
                  gh api "repos/${{ github.repository }}/issues/$PR/comments" \
                    -f "body=@$COMMENTER_LOGIN answering requires write access to this repository." >/dev/null 2>&1 || true
                  CMD=""
                fi
              fi
              ;;
          esac
          # A "PR-head run" is any instance keyed pr-<N> (PR/issue-on-PR comment, or a
          # pr-keyed repository_dispatch continue) — the head step then resolves the SHA
          # from the PR head. A plain-issue run (issue-<N>) has a numeric PR for
          # commenting but NO PR head: its SHA comes from CHECKOUT_REF (default branch).
          case "$INSTANCE" in pr-*) IS_PR_RUN=true ;; *) IS_PR_RUN="" ;; esac
          # PR-head runs check out the PR head; if ctx didn't already set a checkout
          # ref (the ref-target / plain-issue cases did), default to the PR merge ref.
          [ -n "$CHECKOUT_REF" ] || { [ "$IS_PR_RUN" = "true" ] && CHECKOUT_REF="refs/pull/$PR/head"; }
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "instance=$INSTANCE" >> "$GITHUB_OUTPUT"
          echo "command=$CMD" >> "$GITHUB_OUTPUT"
          echo "node_path=$NODE_PATH" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "is_pr_run=$IS_PR_RUN" >> "$GITHUB_OUTPUT"
      - id: head
        if: steps.ctx.outputs.command != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.ctx.outputs.pr }}
          IS_PR_RUN: ${{ steps.ctx.outputs.is_pr_run }}
          CHECKOUT_REF: ${{ steps.ctx.outputs.checkout_ref }}
          INSTANCE: ${{ steps.ctx.outputs.instance }}
          PROTO: ${{ inputs.protocol }}
          REPO: ${{ github.repository }}
        run: |
          # The analyzed commit SHA, resolved per target kind:
          #  - PR-head run (pr-<N>): the PR head commit.
          #  - ref-target START (workflow_dispatch) OR plain-issue run (issue-<N>):
          #    the requested ref / default-branch tip (CHECKOUT_REF). A plain-issue
          #    run has a numeric PR (for commenting) but NO PR head, so it must NOT
          #    take the `gh pr view` path.
          #  - ref-target CONTINUE/JOIN (repository_dispatch carries no ref, and a
          #    ui-keyed instance has no ref to recover): read the SHA already pinned
          #    in the instance state at start — the source of truth across all hops.
          if [ -n "$PR" ] && [ "$IS_PR_RUN" = "true" ]; then
            SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          elif [ -n "$CHECKOUT_REF" ]; then
            SHA=$(gh api "repos/$REPO/commits/$CHECKOUT_REF" --jq .sha)
          else
            PID=$(jq -r .name "$PROTO")
            SHA=$(gh api "repos/$REPO/contents/$PID/$INSTANCE/_instance.yaml?ref=agentic-state" \
                   --jq '.content' | base64 -d | sed -n 's/^head_sha:[[:space:]]*//p' | head -1)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      # Diagnostic only, and deliberately BEFORE the first engine write: the two
      # token-pool failures that have actually cost runs were both invisible
      # until rotation reached them mid-flight — an expired PAT (`Bad
      # credentials`, fatal on the dispatch that fires the next phase) and a pool
      # whose members shared one account (GitHub's secondary limits are
      # per-USER, so rotation could not relieve one). Both are answerable up
      # front, and only a job holding the secrets can ask. Never fails the run:
      # `log_token_pool` swallows everything and `continue-on-error` covers the
      # rest.
      - name: Log write-token pool (owner + quota + reset)
        if: steps.ctx.outputs.command != ''
        continue-on-error: true
        env:
          PUBLISH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
          PUBLISH_TOKEN_2: ${{ secrets.POC_DISPATCH_TOKEN_2 }}
        run: python3 .github/agent-factory/engine/lib.py log-token-pool
      - id: plan
        if: steps.ctx.outputs.command != ''
        env:
          STATE_REMOTE: https://x-access-token:${{ secrets.POC_DISPATCH_TOKEN }}@github.com/${{ github.repository }}.git
          # next.py's do_answer fires a repository_dispatch (protocol-continue) to
          # advance a gated sub-pipeline to its next sub-state. That needs the
          # dispatch-capable PAT (the default GITHUB_TOKEN cannot trigger
          # workflows). The plan job already holds this PAT via STATE_REMOTE, so
          # this grants no new privilege.
          GH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
          # PUBLISH_TOKEN is the write-capable PAT (not the default GITHUB_TOKEN)
          # because the `combine` merge runs HERE (next.py continue → merge hook),
          # and recover-mental-model's push-mental-model hook needs `contents:write`
          # to force-push the orphan `_mental_model` branch + `actions:read` to
          # download each leg's mm-tree artifact by run_id. The job already holds
          # this PAT via STATE_REMOTE/GH_TOKEN, so this grants no new privilege.
          PUBLISH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
          # Optional write-token pool: set POC_DISPATCH_TOKEN_2 (a second dispatch
          # PAT from a DIFFERENT account) and engine writes fail over to it on a
          # 403/429 rate-limit. Unset => single-token behavior. Add _3, _4, … too.
          PUBLISH_TOKEN_2: ${{ secrets.POC_DISPATCH_TOKEN_2 }}
          # The ACTIONS token for completing the aggregate check-run: a terminal
          # `merge` finalizes here (plan job), but a classic PAT (PUBLISH_TOKEN)
          # cannot create/complete the github-actions[bot] check-run created at
          # pipeline start. GITHUB_TOKEN (the job grants it `checks: write`) can.
          # set_check_run prefers CHECK_RUN_TOKEN over PUBLISH_TOKEN.
          CHECK_RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only token for the expander subprocess (lib.run_expander scopes the
          # expander to THIS token only; the broad PAT above never reaches it).
          EXPANDER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          PROTO: ${{ inputs.protocol }}
          NODE_PATH: ${{ steps.ctx.outputs.node_path }}
          OVERRIDE_ACTOR: ${{ steps.ctx.outputs.override_actor }}
          OVERRIDE_REASON: ${{ steps.ctx.outputs.override_reason }}
          HUMAN_TASK_DECISION: ${{ steps.ctx.outputs.human_task_decision }}
          HUMAN_TASK_ACTOR: ${{ steps.ctx.outputs.human_task_actor }}
          HUMAN_TASK_REASON: ${{ steps.ctx.outputs.human_task_reason }}
          HUMAN_TASK_PR_AUTHOR: ${{ steps.ctx.outputs.human_task_pr_author }}
          ANSWER_BODY: ${{ steps.ctx.outputs.answer_body }}
          ANSWER_ACTOR: ${{ steps.ctx.outputs.answer_actor }}
        run: |
          # driver.py is the one call path to the engine CLIs, shared with the
          # local conductor (see engine/driver.py). It passes NODE_PATH through
          # to next.py from this step's env — the dot-joined tree path of the leg
          # being continued. Empty NODE_PATH → a fresh start (start/reset command).
          python3 .github/agent-factory/engine/driver.py plan \
            /tmp/state "${{ steps.ctx.outputs.instance }}" \
            "$PROTO" "${{ steps.ctx.outputs.command }}" "$HEAD_SHA" > /tmp/action.json
          cat /tmp/action.json
          ACTION=$(jq -r .action /tmp/action.json)
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "iteration=$(jq -r .iteration /tmp/action.json)" >> "$GITHUB_OUTPUT"
          { echo "feedback<<GH_EOF"; jq -r .feedback /tmp/action.json; echo "GH_EOF"; } >> "$GITHUB_OUTPUT"
          # Legs (matrix axis — NODE_PATH coordinate, replaces legacy branch/substate):
          #   run-fork  → legs[] from action (each carries {path, workflow, lane})
          #   run-agent   → one-element [{path, workflow, lane}] from the action
          #   halt/other  → []  (downstream jobs skip)
          # `lane` ("agent" | "code", Task 6) is EMITTED by next.py, not re-derived
          # here — the planner already loaded the protocol and knows the kind;
          # defaulting a missing lane to "agent" keeps pre-7.0.0 action JSON (no
          # `lane` key) dispatching exactly as it always has.
          if [ "$ACTION" = "run-fork" ]; then
            LEGS=$(jq -c '[.legs[] | . + {lane: (.lane // "agent")}]' /tmp/action.json)
          elif [ "$ACTION" = "run-agent" ]; then
            LEGS=$(jq -c '[{path: .path, workflow: .workflow, lane: (.lane // "agent")}]' /tmp/action.json)
          else
            LEGS='[]'
          fi
          echo "legs=$LEGS" >> "$GITHUB_OUTPUT"
          # Inline this leg's resolved inputs (if the action declares any) so the
          # agent reads them from aw_context (.inputs). action.inputs[].path are
          # absolute paths inside the state checkout (/tmp/state). "{}" if none.
          INPUTS_JSON=$(python3 -c '
          import json
          try:
              a = json.load(open("/tmp/action.json"))
          except Exception:
              a = {}
          out = {}
          for i in (a.get("inputs") or []):
              try:
                  out[i["as"]] = json.load(open(i["path"]))
              except Exception:
                  out[i["as"]] = None
          print(json.dumps(out))
          ')
          echo "inputs_json=$INPUTS_JSON" >> "$GITHUB_OUTPUT"
      - id: sabotage
        if: steps.ctx.outputs.command != ''
        env:
          GH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
        run: |
          HAS=$(gh api "repos/${{ github.repository }}/issues/${{ steps.ctx.outputs.pr }}/labels" \
            --jq 'any(.[]; .name == "poc:sabotage")' 2>/dev/null || echo false)
          if [ "$HAS" = "true" ]; then
            echo "sabotage=true" >> "$GITHUB_OUTPUT"
          else
            echo "sabotage=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark pipeline in progress (aggregate check run)
        if: steps.plan.outputs.legs != '[]' && steps.plan.outputs.legs != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.head.outputs.sha }}
          ITER: ${{ steps.plan.outputs.iteration }}
        run: |
          # The aggregate check-run name is the PROTOCOL ID (generic). It stays
          # in_progress until join.py (fan-out) or advance.py (agent phase / no
          # next phase) completes it.
          PID=$(jq -r .name "${{ inputs.protocol }}")
          python3 .github/agent-factory/engine/lib.py set-check-run "$PID" "$SHA" in_progress "" "Pipeline in progress" "Running (iteration $ITER); merge is gated until the protocol completes."
      - name: Ensure shared status comment
        # Fire for a fan-out dispatch AND for an agent dispatch: a multi-phase
        # protocol whose first phase is an agent (e.g. preflight) needs the
        # protocol-level comment + audit link created the moment it starts.
        # ensure-status-comment is a no-op for a single-agent protocol.
        # Skipped for ref-targeted runs (no PR): status lives in the visibility API.
        if: >
          (steps.plan.outputs.action == 'run-fork' || steps.plan.outputs.action == 'run-agent')
          && steps.ctx.outputs.pr != ''
        env:
          STATE_REMOTE: https://x-access-token:${{ secrets.POC_DISPATCH_TOKEN }}@github.com/${{ github.repository }}.git
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          INSTANCE: ${{ steps.ctx.outputs.instance }}
        run: |
          PID=$(jq -r .name "${{ inputs.protocol }}")
          python3 .github/agent-factory/engine/lib.py ensure-status-comment \
            /tmp/state "$PID" "$INSTANCE" "${{ inputs.protocol }}" "$PR"

  # ── Zone 2: the sandboxed agents, one matrix leg per branch/sentinel. ──
  dispatch:
    needs: plan
    if: ${{ needs.plan.outputs.legs != '[]' && needs.plan.outputs.legs != '' }}
    runs-on: ubuntu-latest
    # Belt-and-braces bound: engine hooks/checks have their own
    # subprocess timeout (lib.hook_timeout_seconds), but a job-level
    # cap stops anything else from riding to GitHub's 6h ceiling.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@v5
      - id: wait
        env:
          GH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
          # The dispatch loop's fallback. `run_gh_rotating` covers the engine's
          # `gh api` writers, but this step drives `gh workflow run` / `gh run
          # list` / `gh run watch`, which it cannot wrap — so until this, the
          # busiest polling path in the engine was the ONE call path with no
          # second token. Measured: on 2026-08-14 the honesty legs died here on
          # `HTTP 403: API rate limit exceeded` while POC_DISPATCH_TOKEN_2 sat
          # untouched at 5000/5000, and took `post-fix` and `mrp` with them —
          # the agent never started, so checks and advance then failed on a
          # missing evidence artifact.
          GH_TOKEN_2: ${{ secrets.POC_DISPATCH_TOKEN_2 }}
          PR: ${{ needs.plan.outputs.pr }}
          ITERATION: ${{ needs.plan.outputs.iteration }}
          FEEDBACK: ${{ needs.plan.outputs.feedback }}
          SABOTAGE: ${{ needs.plan.outputs.sabotage }}
          REPO: ${{ github.repository }}
          PROTO: ${{ inputs.protocol }}
          NODE_PATH: ${{ matrix.leg.path }}
          LEG_WORKFLOW: ${{ matrix.leg.workflow }}
          LEG_LANE: ${{ matrix.leg.lane }}
          INPUTS_JSON: ${{ needs.plan.outputs.inputs_json }}
          LEG_INPUTS: ${{ toJSON(matrix.leg.inputs) }}
          CHECKOUT_REF: ${{ needs.plan.outputs.checkout_ref }}
          SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          # `gh` with the pool's second token as a rate-limit fallback. The
          # engine's `gh api` writers rotate via lib.run_gh_rotating; these are
          # `gh run`/`gh workflow` subcommands, which that helper does not wrap.
          #
          # Deliberately narrow, matching run_gh_rotating's own rule: it retries
          # ONLY on a rate-limit, never on a permission 403 — retrying a
          # permission failure on a second token would mask a real
          # misconfiguration as a transient blip. With no second token set, or
          # on any other error, behaviour is exactly as before.
          ghp() {
            out=$("$@" 2>&1); rc=$?
            if [ $rc -ne 0 ] && [ -n "${GH_TOKEN_2:-}" ] \
               && printf '%s' "$out" | grep -qiE "rate limit|secondary rate|abuse detection|429"; then
              echo "[engine] dispatch: rate-limited on token 1; retrying on token 2" >&2
              out=$(GH_TOKEN="$GH_TOKEN_2" "$@" 2>&1); rc=$?
            fi
            printf '%s' "$out"
            return $rc
          }
          # Correlation id: unique per dispatch (run id + attempt + leg path).
          # The leg token is derived from the dot-path (dots → dashes for readability).
          LEGTOK=$(printf '%s' "$NODE_PATH" | tr '.' '-')
          [ -n "$LEGTOK" ] || LEGTOK="agent"
          CID="${{ github.run_id }}-${{ github.run_attempt }}-${LEGTOK}"
          # Prefer this leg's per-leg runtime item (dynamic fork); fall back to the
          # shared declared-inputs blob (static). LEG_INPUTS is 'null' when absent.
          if [ -n "$LEG_INPUTS" ] && [ "$LEG_INPUTS" != "null" ]; then
            INPUTS="$LEG_INPUTS"
          else
            INPUTS="$INPUTS_JSON"; [ -n "$INPUTS" ] || INPUTS='{}'
          fi
          # ref/sha let an agent check out the analyzed code for either target kind.
          # Prefer the explicit checkout ref (PR head ref, or the ref a ref-target
          # START requested); fall back to the resolved SHA for ref-target CONTINUE
          # hops, where the dispatch carries no ref (the SHA is pinned in state).
          REF="${CHECKOUT_REF:-$SHA}"
          # Workflow comes from the matrix leg (next.py emits it in legs[]); read
          # via env var (never interpolated) to keep the security invariant.
          NAME="$LEG_WORKFLOW"
          [ -n "$NAME" ] || { echo "no agent workflow in matrix leg for NODE_PATH='$NODE_PATH'" >&2; exit 1; }
          mkdir -p /tmp/meta
          T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Two lanes (Task 6), sharing everything from here down (the cid poll
          # loop, match_run_by_cid, `gh run watch`, the runmeta artifact) — that
          # sharing is the entire point of routing dispatched code through the
          # agent lane. `LEG_LANE` is emitted by next.py, never re-derived here.
          #
          #   agent: <name>.lock.yml, gh-aw's compiler-generated `aw_context` input
          #          (8 fields — pr/iteration/feedback/sabotage/cid/inputs/ref/sha).
          #   code:  <name>.yml, a hand-written `protocol_context` input (6 fields
          #          — cid/pr/ref/sha/inputs/iteration). `feedback`/`sabotage` are
          #          DROPPED: a re-dispatched script cannot consume feedback (bare
          #          retry, no feedback loop), and sabotage is LLM test scaffolding,
          #          meaningless for a deterministic step.
          if [ "$LEG_LANE" = "code" ]; then
            WF="$NAME.yml"
            PCTX=$(jq -nc \
              --arg cid "$CID" --arg pr "$PR" --arg ref "$REF" --arg sha "$SHA" \
              --argjson inputs "$INPUTS" --arg iteration "$ITERATION" \
              '{cid: $cid, pr: $pr, ref: $ref, sha: $sha, inputs: $inputs, iteration: $iteration}')
            ghp gh workflow run "$WF" --repo "$REPO" -f protocol_context="$PCTX"
          else
            WF="$NAME.lock.yml"
            CTX=$(jq -nc \
              --arg pr "$PR" --arg iteration "$ITERATION" --arg feedback "$FEEDBACK" \
              --argjson sabotage "$SABOTAGE" --arg cid "$CID" \
              --argjson inputs "$INPUTS" --arg ref "$REF" --arg sha "$SHA" \
              '{pr: $pr, iteration: $iteration, feedback: $feedback, sabotage: $sabotage, cid: $cid, inputs: $inputs, ref: $ref, sha: $sha}')
            ghp gh workflow run "$WF" --repo "$REPO" -f aw_context="$CTX"
          fi
          RID=""
          for i in $(seq 1 24); do
            sleep 5
            RUNS=$(ghp gh run list --repo "$REPO" --workflow "$WF" --event workflow_dispatch \
              --created ">=$T0" --json databaseId,displayTitle)
            RID=$(python3 .github/agent-factory/engine/lib.py match-run-by-cid "$RUNS" "$CID")
            [ -n "$RID" ] && break
          done
          [ -n "$RID" ] || { echo "no agent run matched cid:[$CID] for $WF" >&2; exit 1; }
          printf '%s' "$RID" > /tmp/meta/run_id
          if ghp gh run watch "$RID" --repo "$REPO" --exit-status; then
            printf '%s' "true" > /tmp/meta/agent_ok
          else
            printf '%s' "false" > /tmp/meta/agent_ok
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runmeta-${{ matrix.leg.path }}
          path: /tmp/meta

  # ── Zone 3: checks. No secrets beyond the default read token. ──
  checks:
    needs: [plan, dispatch]
    if: always() && needs.plan.outputs.legs != '[]' && needs.plan.outputs.legs != '' && needs.dispatch.result != 'skipped'
    runs-on: ubuntu-latest
    # Belt-and-braces bound: engine hooks/checks have their own
    # subprocess timeout (lib.hook_timeout_seconds), but a job-level
    # cap stops anything else from riding to GitHub's 6h ceiling.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Download run meta
        uses: actions/download-artifact@v7
        with:
          name: runmeta-${{ matrix.leg.path }}
          path: /tmp/meta
      - id: meta
        run: |
          RID=$(cat /tmp/meta/run_id 2>/dev/null || echo "")
          OK=$(cat /tmp/meta/agent_ok 2>/dev/null || echo "")
          echo "rid=$RID" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
      - name: Download evidence artifact
        run: |
          mkdir -p /tmp/agent
          if [ -n "${{ steps.meta.outputs.rid }}" ]; then
            gh run download "${{ steps.meta.outputs.rid }}" \
              --repo "${{ github.repository }}" -n evidence -D /tmp/agent || echo "no evidence artifact"
          fi
      - name: Fetch independent ground truth
        env:
          PR: ${{ needs.plan.outputs.pr }}
          IS_PR_RUN: ${{ needs.plan.outputs.is_pr_run }}
        run: |
          # PR-targeted runs: independently re-fetch the PR diff (the checks' ground
          # truth, never trusting agent output). Ref-targeted (UI/workflow_dispatch)
          # AND issue-keyed (e.g. impl-feature-auto) runs have no PR — write empty
          # diff/files; those protocols' checks verify evidence, not a diff. Gate on
          # IS_PR_RUN, not `-n PR`: an issue-keyed run carries PR=<issue-number> (for
          # commenting/labeling), which is NOT a resolvable pull request — `gh pr diff`
          # on it fails ("Could not resolve to a PullRequest").
          if [ "$IS_PR_RUN" = "true" ]; then
            gh pr diff "$PR" --repo "${{ github.repository }}" > /tmp/diff.txt
            gh pr diff "$PR" --repo "${{ github.repository }}" --name-only > /tmp/files.txt
          else
            : > /tmp/diff.txt
            : > /tmp/files.txt
          fi
      - name: Run checks
        env:
          RID: ${{ steps.meta.outputs.rid }}
          OK: ${{ steps.meta.outputs.ok }}
          NODE_PATH: ${{ matrix.leg.path }}
          PROTO: ${{ inputs.protocol }}
          # PR number reaches the checks via env (generic context, like PR_BODY).
          # A protocol check (e.g. code-review's local-review-evidence) uses it to
          # fetch its own review activity with this job's read-only token — the
          # engine prefetches nothing protocol-specific.
          PR: ${{ needs.plan.outputs.pr }}
        run: |
          # run-checks.py resolves the check LIST + node-scoped params from the
          # protocol given NODE_PATH. NODE_PATH is the dot-joined tree path of the
          # leg (e.g. "review.grumpy"); run-checks.py reads it from env.
          EV=/tmp/agent/evidence.json
          if [ ! -f "$EV" ]; then
            echo "WARNING: no evidence artifact (agent run $RID, ok=$OK); checks will report it" >&2
            echo '{}' > "$EV"
          fi
          # NODE is derived from NODE_PATH (the full dot-path passed as the state-id
          # positional arg; run-checks.py reads NODE_PATH env to navigate the tree).
          NODE="$NODE_PATH"
          # Make the PR description + title available to checks (env, never
          # interpolated into this run: block). Fetched from GitHub by this
          # trusted job — not from agent output. Multiline body stays in a shell
          # var; run-checks.py forwards the job env to each check.
          PR_BODY="$(gh pr view "${{ needs.plan.outputs.pr }}" --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null || true)"
          PR_TITLE="$(gh pr view "${{ needs.plan.outputs.pr }}" --repo "${{ github.repository }}" --json title --jq '.title' 2>/dev/null || true)"
          export PR_BODY PR_TITLE
          VERDICTS=$(python3 .github/agent-factory/engine/driver.py run-checks \
            "$PROTO" "$NODE" "$EV" /tmp/diff.txt /tmp/files.txt)
          # A failed dispatch (agent OR dispatched code) gets a synthetic
          # failure verdict prepended, mirroring the checks-job-absent
          # precedent below (see the join/advance step further down). This
          # is FAILURE-ONLY: `pass` means a check settled a claim against
          # ground truth, and nothing did here — a job's exit status is the
          # process axis, not a claim. There is no `pass: true` counterpart.
          # Severity is "iterate" (not "block") so a transient failure
          # (npm/pip install, a flaky `gh api` call) consumes a retry;
          # `max_iterations: 1` is how an author expresses "do not retry".
          # $OK comes from env (steps.meta.outputs.ok), never interpolated
          # into this run: block.
          if [ "$OK" = "false" ]; then
            VERDICTS=$(jq \
              '.results = [{"check":"dispatched-run","pass":false,"on_fail":"iterate","feedback":"dispatched run failed"}] + .results' \
              <<<"$VERDICTS")
          fi
          jq . <<<"$VERDICTS"
          mkdir -p /tmp/verdicts
          printf '%s' "$VERDICTS" > /tmp/verdicts/verdicts.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verdicts-${{ matrix.leg.path }}
          path: /tmp/verdicts

  # ── Zone 4: engine-post. Reads check verdicts only; sole writer of state. ──
  advance:
    needs: [plan, dispatch, checks]
    if: always() && needs.plan.outputs.legs != '[]' && needs.plan.outputs.legs != '' && needs.dispatch.result != 'skipped' && (needs.checks.result == 'success' || needs.checks.result == 'failure')
    runs-on: ubuntu-latest
    # Belt-and-braces bound: engine hooks/checks have their own
    # subprocess timeout (lib.hook_timeout_seconds), but a job-level
    # cap stops anything else from riding to GitHub's 6h ceiling.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Download run meta
        uses: actions/download-artifact@v7
        with:
          name: runmeta-${{ matrix.leg.path }}
          path: /tmp/meta
      - name: Download verdicts
        uses: actions/download-artifact@v7
        with:
          name: verdicts-${{ matrix.leg.path }}
          path: /tmp/verdicts
      - name: Re-download evidence (for publication only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/agent
          RID=$(cat /tmp/meta/run_id 2>/dev/null || echo "")
          if [ -n "$RID" ]; then
            gh run download "$RID" --repo "${{ github.repository }}" -n evidence -D /tmp/agent || true
          fi
          [ -f /tmp/agent/evidence.json ] || echo '{"files":[]}' > /tmp/agent/evidence.json
      # See the plan job's copy. Logged here too because `advance` is where the
      # pool is under the most pressure — it is the last job of every iteration
      # and the one whose `dispatches` call fires the next phase, so a token that
      # dies here parks the run.
      - name: Log write-token pool (owner + quota + reset)
        continue-on-error: true
        env:
          PUBLISH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
          PUBLISH_TOKEN_2: ${{ secrets.POC_DISPATCH_TOKEN_2 }}
        run: python3 .github/agent-factory/engine/lib.py log-token-pool
      - name: Advance
        env:
          STATE_REMOTE: https://x-access-token:${{ secrets.POC_DISPATCH_TOKEN }}@github.com/${{ github.repository }}.git
          GH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
          # conclude-fix pushes to the PR head + closes issues; publish-review opens issues.
          # Needs contents:write + issues:write — use the write-capable PAT, not GITHUB_TOKEN.
          PUBLISH_TOKEN: ${{ secrets.POC_DISPATCH_TOKEN }}
          # Optional write-token pool (see plan job): rotate to POC_DISPATCH_TOKEN_2
          # on a 403/429 rate-limit. Add PUBLISH_TOKEN_3, _4, … for more.
          PUBLISH_TOKEN_2: ${{ secrets.POC_DISPATCH_TOKEN_2 }}
          # The Actions token completes the aggregate check-run here too: a classic
          # PAT cannot complete a github-actions[bot] check-run, so without this the
          # advance check-run write fell back to the PAT and 403'd under load.
          CHECK_RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ needs.plan.outputs.pr }}
          PR_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          NODE_PATH: ${{ matrix.leg.path }}
          PROTO: ${{ inputs.protocol }}
          # Runtime toggle (repo variable): "1"/"true" => preflight runs advisory
          # (conclude-preflight surfaces findings but never blocks). Unset => enforcing.
          PREFLIGHT_ADVISORY: ${{ vars.PREFLIGHT_ADVISORY }}
        run: |
          export AGENT_RUN_ID=$(cat /tmp/meta/run_id 2>/dev/null || echo "")
          VERDICTS=$(cat /tmp/verdicts/verdicts.json 2>/dev/null || echo "")
          if [ -z "$VERDICTS" ]; then
            VERDICTS='{"results":[{"check":"checks-job","pass":false,"feedback":"checks job did not complete; treating as failed iteration"}]}'
          fi
          printf '%s' "$VERDICTS" > /tmp/verdicts.json
          jq . /tmp/verdicts.json
          python3 .github/agent-factory/engine/driver.py advance \
            /tmp/state "${{ needs.plan.outputs.instance }}" \
            "$PROTO" /tmp/verdicts.json /tmp/agent/evidence.json
